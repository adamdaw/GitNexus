name: Diagnostic bwrap 26.04

# THROWAWAY DIAGNOSTIC. Never merge. Confirms why nested bubblewrap fails on
# ubuntu-26.04 (v2: nested probe mounts a fresh /proc so uid_map is writable). Every probe is non-fatal so the job log is always readable.

on:
  pull_request:
    paths:
      - '.github/workflows/diag-bwrap-26-04.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: diag / bwrap nesting (ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 1. Record environment
        shell: bash
        run: |
          echo '## uname'; uname -a || true
          echo '## image'; echo "${ImageVersion:-unset}" || true
          echo '## bwrap path'; command -v bwrap || true
          readlink -f "$(command -v bwrap)" || true
          bwrap --version || true
          echo '## LSM'; cat /sys/kernel/security/lsm || true; echo
          echo '## sysctls'
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sysctl user.max_user_namespaces || true
          sysctl kernel.unprivileged_userns_clone || true
          echo '## apparmor tools'
          command -v aa-status || true
          command -v apparmor_parser || true
          echo '## shipped profiles mentioning bwrap/bubblewrap'
          grep -rlsiE 'bwrap|bubblewrap' /etc/apparmor.d || true
          for f in $(grep -rlsiE 'bwrap|bubblewrap' /etc/apparmor.d || true); do
            echo "### $f"; cat "$f" || true
          done
          echo '## aa-status | grep bwrap'
          sudo aa-status | grep -i -E 'bwrap|bubblewrap' || true
      - name: 2. Install bubblewrap and set userns sysctl
        shell: bash
        run: |
          command -v bwrap || { sudo apt-get update || true; sudo apt-get install --yes --no-install-recommends bubblewrap || true; }
          command -v bwrap || true
          bwrap --version || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
      - name: 3. Probes A-D (v2)
        shell: bash
        run: |
          SHIPPED=/etc/apparmor.d/bwrap-userns-restrict
          BW="$(readlink -f "$(command -v bwrap)")"
          INNER=(bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid true)
          show_denied() {
            echo "--- kernel AppArmor DENIED lines:"
            sudo dmesg | grep -E 'apparmor="DENIED"' | tail -n 20 || true
            echo "--- end"
          }
          outer_probe() {
            sudo dmesg -C || true
            local rc=0
            bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid true || rc=$?
            echo "outer rc=${rc}"; show_denied; OUTER_RC=$rc
          }
          nested_probe() {
            sudo dmesg -C || true
            local rc=0
            bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid "${INNER[@]}" || rc=$?
            echo "nested rc=${rc}"; show_denied; NESTED_RC=$rc
          }
          echo "bwrap=${BW}"
          sysctl kernel.apparmor_restrict_unprivileged_userns || true

          echo '=== A: outer probe, shipped profiles'
          outer_probe || true; A=$OUTER_RC

          echo '=== B: nested probe, shipped profiles'
          nested_probe || true; B=$NESTED_RC

          echo '=== C: CONTROL, shipped bwrap profile unloaded, nested probe'
          sudo apparmor_parser -R "$SHIPPED" || true
          sudo aa-status | grep -i -E 'bwrap|bubblewrap' || echo '(no bwrap profiles loaded)'
          nested_probe || true; C=$NESTED_RC
          sudo apparmor_parser -r "$SHIPPED" || true
          sudo aa-status | grep -i -E 'bwrap|bubblewrap' || true

          echo '=== D1: permissive replacement profile'
          sudo tee /etc/apparmor.d/diag-bwrap >/dev/null <<PROFILE
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap ${BW} flags=(unconfined) {
            userns,
          }
          PROFILE
          cat /etc/apparmor.d/diag-bwrap || true
          sudo apparmor_parser -r /etc/apparmor.d/diag-bwrap || true
          sudo aa-status | grep -i -E 'bwrap|bubblewrap' || true
          echo '--- D1 nested'; nested_probe || true; D1=$NESTED_RC
          echo '--- D1 outer'; outer_probe || true; D1_OUTER=$OUTER_RC

          # D2 variants: shipped file with the stacking line replaced.
          # Restore shipped profile first, then load each variant over it.
          sudo apparmor_parser -r "$SHIPPED" || true
          D2=skipped; D2B=skipped
            echo '=== D2: shipped copy, stacking line -> pix /** -> unconfined'
            sudo sed 's#^\( *\)allow pix /\*\* -> &bwrap//&unpriv_bwrap,#\1pix /** -> unconfined,#' "$SHIPPED" | sudo tee /etc/apparmor.d/diag-bwrap-d2 >/dev/null
            grep -n 'pix /\*\*' /etc/apparmor.d/diag-bwrap-d2 || true
            sudo apparmor_parser -r /etc/apparmor.d/diag-bwrap-d2 || true
            echo '--- D2 nested'; nested_probe || true; D2=$NESTED_RC
            echo '--- D2 outer'; outer_probe || true
            sudo apparmor_parser -r "$SHIPPED" || true
            echo '=== D2b: shipped copy, stacking line -> ix'
            sudo sed 's#^\( *\)allow pix /\*\* -> &bwrap//&unpriv_bwrap,#\1ix /**,#' "$SHIPPED" | sudo tee /etc/apparmor.d/diag-bwrap-d2b >/dev/null
            grep -n 'ix /\*\*' /etc/apparmor.d/diag-bwrap-d2b || true
            sudo apparmor_parser -r /etc/apparmor.d/diag-bwrap-d2b || true
            echo '--- D2b nested'; nested_probe || true; D2B=$NESTED_RC
          echo "A_OUTER=${A} B_NESTED=${B} C_CONTROL_NESTED=${C} D1_NESTED=${D1} D2_NESTED=${D2} (D1_OUTER=${D1_OUTER} D2B_NESTED=${D2B})"
